services:
  - type: web
    name: jlpt-dokkai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SHUFFLE_SECRET
        generateValue: true  # Step 11d: HMAC key for answer-option shuffling; keep it stable

